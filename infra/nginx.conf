# ────────────────────────────────────────────────────────────────
# Nginx — Central de Notificações Push (Brokers Brasil)
#
#   cp infra/nginx.conf /etc/nginx/sites-available/bbr-push
#   sed -i 's/avisos.seudominio.com.br/SEU_DOMINIO/g' /etc/nginx/sites-available/bbr-push
#   ln -sf /etc/nginx/sites-available/bbr-push /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d SEU_DOMINIO --redirect
#
# O Certbot cria o bloco 443 com o certificado e o redirecionamento.
# Este arquivo cobre a porta 80 e o proxy para o Node.
# ────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name avisos.seudominio.com.br;

    # Sem isso, todo push falha: navegador só registra service worker em HTTPS.
    # O Certbot substitui este bloco pelo redirecionamento definitivo.

    client_max_body_size 1m;

    # Compressão dos arquivos do PWA
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # O backend precisa do IP real para o rate limit funcionar
        # (combine com TRUST_PROXY=1 no .env).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # O service worker precisa de escopo raiz e nunca pode ficar preso em
    # cache — senão o app continua rodando a versão antiga após um deploy.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    access_log /var/log/nginx/bbr-push.access.log;
    error_log  /var/log/nginx/bbr-push.error.log;
}
